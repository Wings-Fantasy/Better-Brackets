# --- Settings Navigation Menu Titles ---
settings.menu.introduction=Customize the style and color of brackets. You can control whether the plugin manages the display of brackets for individual programming languages, and define specific colors for brackets at each nesting depth. When the plugin takes over, it displays brackets in varying colors based on their nesting depth; if disabled, the brackets revert to their native appearance, governed by the IDE’s color scheme.
settings.menu.main=Better Brackets
settings.menu.Function=Function
settings.menu.color=Color

